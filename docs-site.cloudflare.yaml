# Cloudflare Workers variant of docs-site.yaml — same content policy, root
# base path for domain-root serving at https://repo-policy.shipsolid.workers.dev/.
# Used only by scripts/build-docs.sh (the build command Cloudflare's native Git
# integration runs); the GitHub Pages job in .github/workflows/docs.yml reads
# docs-site.yaml instead. Keep title/description/nav in sync with that file —
# only `base` should differ.
title: repo-policy
description: >-
  Lightweight, declarative repository governance for GitHub — branch
  protection and ruleset configuration as YAML, audited and applied locally
  or in CI.

base: /

social:
  github: https://github.com/shipsolid/repo-policy

# Keep in sync with docs-site.yaml's root_docs/nav — see that file's comment.
root_docs:
  - ARCHITECTURE.md
  - CHANGELOG.md
  - { path: CODE_OF_CONDUCT.md, title: Code of Conduct }
  - CONTRIBUTING.md
  - { path: FAQ.md, title: FAQ }
  - ROADMAP.md
  - SECURITY.md
  - SUPPORT.md
  - USAGE.md
  - { path: usecases.md, title: Use Cases }

nav:
  - { label: Architecture, dir: adrs }
  - { label: Guides, items: [ci-cd, test-strategy, troubleshooting, release-readiness-v1] }
  - label: Reference
    items:
      [
        project-readme,
        architecture,
        usage,
        faq,
        usecases,
        roadmap,
        changelog,
        contributing,
        code-of-conduct,
        security,
        support,
      ]
