name: Release

# Triggered by the same push-to-main event as CI. The `ci` job below runs CI's own job graph as a
# reusable workflow against this exact commit before `release` is allowed to start - a
# same-workflow-run dependency (needs: ci), not a second, independently-triggered workflow whose
# completion this workflow would have to trust after the fact.
#
# An earlier version of this file used a `workflow_run` trigger for that instead. zizmor's
# dangerous-triggers audit flags workflow_run unconditionally at high severity - by zizmor's own
# documentation, no amount of `if:` filtering on the receiving side (checking conclusion,
# head_branch, repository, head_sha) makes it safe in zizmor's model, and a `github.repository`
# check specifically is called out as ineffective because workflow_run always executes in the
# target repository's context regardless. workflow_call sidesteps the whole trigger class: CI runs
# in the same workflow run as the release job, on the same commit, with no separate event to
# validate. See docs/ci-cd.md for the full rationale.
on:
  push:
    branches: [main]

# Serialize the whole release pipeline: two rapid pushes to main must queue and finish in order,
# never race on the same version/tag/PyPI state. Queued runs are kept (not cancelled) so no
# validated commit's release is silently dropped.
concurrency:
  group: release-main
  cancel-in-progress: false

# No job inherits repo-default permissions; each job below declares exactly what it needs.
permissions: {}

jobs:
  ci:
    name: ci
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # semantic-release commits the version bump/changelog and pushes the tag
    outputs:
      released: ${{ steps.release.outputs.released }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@21ed7fa03e4a17ac49406eff4b60d5ad050fbdc2 # v9 (currently v9.21.2)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Belt-and-suspenders check on top of the `needs: ci` gate above: if semantic-release (or a
      # compromised/misbehaving version of it) ever touched anything beyond the version bump and
      # changelog, stop here - before the tag moves and before anything is built for PyPI.
      - name: Validate the release commit only touched version/changelog files
        if: steps.release.outputs.released == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          allowed="pyproject.toml src/repo_policy/__init__.py CHANGELOG.md"
          changed="$(git diff --name-only "$SOURCE_SHA" HEAD)"
          unexpected=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case " $allowed " in
              *" $file "*) ;;
              *) unexpected="$unexpected $file" ;;
            esac
          done <<< "$changed"
          if [ -n "$unexpected" ]; then
            echo "::error::Release commit changed unexpected file(s):$unexpected"
            exit 1
          fi

      # Runs before PyPI publish, not after: these two steps are independent, and the Action's
      # `uses: shipsolid/repo-policy@v0` consumers must not be blocked by an unrelated PyPI
      # failure. (A real release found this the hard way: the tag never moved because it was
      # sequenced after PyPI, and PyPI failed on every release — v0.1.0 through v0.1.2 — until
      # the trusted publisher was registered on pypi.org; see docs/ci-cd.md. Fixed as of v0.1.3.)
      - name: Move floating major tag
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          MAJOR_TAG="v$(echo "$RELEASE_TAG" | sed -E 's/^v([0-9]+)\..*/\1/')"
          git tag -f "$MAJOR_TAG" "$RELEASE_TAG"
          git push origin "$MAJOR_TAG" --force

      - name: Upload distribution artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

  publish:
    name: publish
    # Split from `release` so only this job - which does nothing but publish already-built,
    # already-validated distributions - carries id-token: write. It never checks out the
    # repository and never sees contents: write.
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing to PyPI; this job never touches repo contents
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (currently v1.14.2)
