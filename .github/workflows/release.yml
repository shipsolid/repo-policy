name: Release

# Triggered by the same push-to-main event as CI. The `ci` job below runs CI's own job graph as a
# reusable workflow against this exact commit before `release` is allowed to start - a
# same-workflow-run dependency (needs: ci), not a second, independently-triggered workflow whose
# completion this workflow would have to trust after the fact.
#
# An earlier version of this file used a `workflow_run` trigger for that instead. zizmor's
# dangerous-triggers audit flags workflow_run unconditionally at high severity - by zizmor's own
# documentation, no amount of `if:` filtering on the receiving side (checking conclusion,
# head_branch, repository, head_sha) makes it safe in zizmor's model, and a `github.repository`
# check specifically is called out as ineffective because workflow_run always executes in the
# target repository's context regardless. workflow_call sidesteps the whole trigger class: CI runs
# in the same workflow run as the release job, on the same commit, with no separate event to
# validate. See docs/ci-cd.md for the full rationale.
on:
  push:
    branches: [main]

# Serialize the whole release pipeline: two rapid pushes to main must queue and finish in order,
# never race on the same version/tag/PyPI state. Queued runs are kept (not cancelled) so no
# validated commit's release is silently dropped.
concurrency:
  group: release-main
  cancel-in-progress: false

# No job inherits repo-default permissions; each job below declares exactly what it needs.
permissions: {}

jobs:
  ci:
    name: ci
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read

  # Deliberately has no `needs:` of its own -- it runs immediately, in parallel with `ci` above,
  # not after it. This is a cheap, read-only, side-effect-free question ("does this commit's
  # history contain any feat:/fix:/breaking-change commit since the last release tag?"), not a
  # release-readiness gate, so it doesn't need CI's result to answer it, and answering it fast is
  # the entire point (see below).
  #
  # Without this job, `release` below would sit behind `environment: release`'s human-approval gate
  # on EVERY qualifying push to `main` -- including a chore:/docs:-only push that will never
  # actually release anything -- just to let python-semantic-release discover there's nothing to
  # do. That's more than an inconvenience on this repository: the whole pipeline runs under
  # `concurrency: release-main` with `cancel-in-progress: false`, so an approval request nobody
  # responds to (environment approvals default to a 30-day timeout) holds that concurrency slot the
  # entire time, wedging every later push's `release` job -- and, transitively, their own `ci` job
  # inside this same workflow run -- behind it. Gating `release` on this job's answer means only a
  # push that actually warrants a release ever reaches the approval step.
  check-release-warranted:
    name: check-release-warranted
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      warranted: ${{ steps.check.outputs.warranted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs full history to walk back to the last release tag
          persist-credentials: false # read-only job, never pushes anything

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # `semantic-release version --print-tag` alone isn't enough to distinguish "nothing to
      # release" from "a release is warranted" by exit code: confirmed by reading the installed
      # 9.21.2's version.py and reproducing locally -- with no other flag, it prints a tag AND
      # exits 0 in both cases (when nothing is warranted, it prints the *already-released* current
      # tag, then a separate "already been released" notice, and returns 0). Root-level `--strict`
      # changes that: it makes the "already released / nothing to bump" path `ctx.exit(2)` instead,
      # confirmed the same way -- a fresh scratch repo with only chore: commits since its last tag
      # exits 2 under `--strict version --print-tag` with no commit/tag/push side effects, and the
      # same repo with a fix: commit added exits 0 and prints the new tag, also with zero side
      # effects (print_only_tag short-circuits before any git-mutating code path runs). Installed
      # via pip, the same explicitly-pinned way `release`'s version-bump step and the
      # "Create the GitHub release" step below both do -- all three python-semantic-release
      # invocations in this workflow pin the same package version now, not just an Action wrapping
      # it (see the version-bump step's own comment for the incident that made this the rule).
      - name: Check whether a release is warranted (no side effects)
        id: check
        run: |
          set -euo pipefail
          pip install --quiet "python-semantic-release==9.21.2"
          if semantic-release --strict version --print-tag; then
            echo "warranted=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "No release is warranted for this commit (no feat:/fix:/breaking-change commits since the last release tag)"
              echo "warranted=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::semantic-release --print-tag failed unexpectedly (exit ${status}), not just 'nothing to release' -- treating this as a real failure rather than silently gating the release job closed"
              exit "$status"
            fi
          fi

  # Task 9 applied real branch protection to `main`: pull_requests.required + enforce_admins, and
  # repo-policy deliberately never manages a PR-bypass allowlist for this repo (read-through, never
  # cleared/set -- see src/repo_policy/policies/pull_requests.py). That means nothing, including
  # this workflow, can push the version-bump commit straight to `main` anymore -- it has to land
  # via a real, merged pull request. Tag pushes are unaffected: classic branch protection
  # (`PUT /repos/{owner}/{repo}/branches/{branch}/protection`, what repository-policy.yml declares
  # for `main`) is structurally scoped to `refs/heads/<branch>` only -- there is no tag-scoped
  # equivalent in that API, and this repo's self-policy configures neither a Ruleset nor a classic
  # tag-protection rule for `refs/tags/*`. So the release TAG is still pushed directly here, same
  # as before Task 9; only the COMMIT needs the new PR path. See docs/ci-cd.md for the full
  # research trail (GitHub's own docs on rebase-merge and tag protection) behind this job's design.
  release:
    name: release
    needs: [ci, check-release-warranted]
    if: needs.check-release-warranted.outputs.warranted == 'true'
    runs-on: ubuntu-latest
    # Every real release now pauses here for a human approval click, by design: the `release`
    # GitHub Environment (create it with a required-reviewer protection rule -- see docs/ci-cd.md's
    # "What you still need to set up on GitHub") gates this job's start, and the release-bot's PAT
    # and SSH signing key are stored as secrets scoped to that environment, not as repository
    # secrets -- so they are not even materialized on the runner until the approval is granted.
    # `check-release-warranted` above (no environment: gate of its own) is what keeps a
    # non-release push from ever reaching this approval wait in the first place.
    environment: release
    timeout-minutes: 45 # bounds the PR-wait loop below against a hung/broken CI run blocking the release-main concurrency queue indefinitely
    permissions:
      contents: read # nothing here writes through the default GITHUB_TOKEN -- every push/PR/merge/release-create call below authenticates as the release-bot via secrets.RELEASE_BOT_TOKEN instead
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }} # consumed by the `sbom` and `release-assets` jobs below to checkout/tag/upload against the exact released commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The release-bot's own identity, not the default token: every git push and gh call in
          # this job needs to authenticate as shipsolid-release-bot, both because the bot -- not
          # this workflow's ambient GITHUB_TOKEN -- is what opens/merges the release PR, and
          # because pushes made with the default GITHUB_TOKEN never trigger new workflow runs
          # (deliberate GitHub Actions loop protection); a PAT's pushes do, which is exactly what
          # step "Wait for the PR's required check and squash-merge it" below depends on to get a
          # real `CI / required` check on the PR's head commit.
          token: ${{ secrets.RELEASE_BOT_TOKEN }}

      # Git signing config for every plain `run:` step in this job -- the version-bump step, the
      # verify-commit/verify-tag smoke test, both diff-checks, and the tag-creation/floating-tag
      # steps further down all run on this same host and inherit this one config. (An earlier
      # version of this job ran the version-bump step inside a separate Docker container Action,
      # whose own isolated `$HOME` meant this same config had to be duplicated a second time just
      # for the container -- see the version-bump step's own comment for why that Action is gone.)
      - name: Configure host-side git signing
        env:
          RELEASE_BOT_SIGNING_KEY: ${{ secrets.RELEASE_BOT_SIGNING_KEY }}
          RELEASE_BOT_SSH_PUBLIC_KEY: ${{ vars.RELEASE_BOT_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/release_bot_signing_key"
          allowed_signers_path="$RUNNER_TEMP/allowed_signers"
          printf '%s\n' "$RELEASE_BOT_SIGNING_KEY" > "$key_path"
          chmod 600 "$key_path"
          # Principal must match GIT_COMMIT_AUTHOR's email in the version-bump step below --
          # git verify-commit/git verify-tag check the signer's identity against this file's
          # principal, not just that the key matches.
          printf 'amitsingh007s+repopolicybot@gmail.com %s\n' "$RELEASE_BOT_SSH_PUBLIC_KEY" > "$allowed_signers_path"
          git config --global gpg.format ssh
          git config --global user.signingKey "$key_path"
          git config --global gpg.ssh.allowedSignersFile "$allowed_signers_path"
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global user.name shipsolid-release-bot
          git config --global user.email amitsingh007s+repopolicybot@gmail.com

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Compute-only: this step commits and tags LOCALLY (signed -- via the host-side git config
      # from the step above) but does not push and does not create a GitHub Release yet.
      # python-semantic-release's `version` command exposes --push/--no-push and
      # --vcs-release/--no-vcs-release as independent flags; splitting "compute+commit+tag" from
      # "push+release" this way is what lets the commit go through a real PR instead of a direct
      # push, and lets the tag get created against the commit that actually lands on `main` after
      # that PR merges (see the tag step near the bottom of this job for why that distinction
      # matters).
      #
      # Previously ran via the `python-semantic-release/python-semantic-release` Docker Action
      # (pinned by commit SHA). That SHA pin only pins the ACTION's own code -- not the version of
      # the `python-semantic-release` PyPI package its Dockerfile installs, which is resolved fresh
      # on every build. This caused a real incident: the Action's container installed
      # python-semantic-release 10.6.2 (not the 9.21.2 this project is designed and tested
      # against), and 10.6.2 computed a "patch"-type bump from 0.4.7 as "1.0.0" instead of the
      # correct "0.4.8" -- confirmed in that incident's own job logs, and confirmed the other way
      # too: installing the pinned 9.21.2 directly and running `semantic-release version --print`
      # against this exact commit history correctly prints "0.4.8". Fix: stop depending on the
      # Action's own floating dependency resolution entirely -- install python-semantic-release
      # explicitly pinned via pip, exactly like `check-release-warranted` and the "Create the
      # GitHub release" step below already (and correctly) do. This also means the Action's
      # ssh_*_signing_key inputs are no longer needed here: running on the host rather than in the
      # Action's isolated container means this step already inherits the host-side signing config
      # the step above just set up -- no separate, redundant signing setup required.
      #
      # GIT_COMMIT_AUTHOR is still needed explicitly, though -- confirmed by reading
      # python-semantic-release's own source (gitproject.py, config.py): PSR does NOT read the
      # committer identity from host `git config user.name`/`user.email` the way a plain
      # `git commit` would. It force-exports GIT_AUTHOR_NAME/EMAIL and GIT_COMMITTER_NAME/EMAIL
      # from its own `commit_author` setting (default "semantic-release <semantic-release>"),
      # overriding whatever host git config the step above set. Without this, the release commit
      # would land authored/committed as that default identity instead of the release-bot's.
      #
      # `semantic-release --strict version --print-tag` first, exactly mirroring
      # `check-release-warranted`'s own proven detection pattern (exit 2 = nothing to release, no
      # side effects either way -- print_only_tag short-circuits before any git-mutating code path
      # runs), to compute this step's `released`/`tag` outputs before the real, mutating
      # `semantic-release version` call below.
      - name: Compute the version bump (commit + tag locally; do not push or create a release yet)
        id: release
        env:
          GIT_COMMIT_AUTHOR: "shipsolid-release-bot <amitsingh007s+repopolicybot@gmail.com>"
        run: |
          set -euo pipefail
          pip install --quiet "python-semantic-release==9.21.2"
          if tag="$(semantic-release --strict version --print-tag)"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            semantic-release version --no-push --no-vcs-release
          else
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "No release is warranted (no feat:/fix:/breaking-change commits since the last release tag) -- unexpected here since check-release-warranted already said otherwise, but handled the same way rather than assumed impossible"
              echo "released=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::semantic-release --print-tag failed unexpectedly (exit ${status})"
              exit "$status"
            fi
          fi

      # Signing smoke test, not the release's real verification gate (that's the tag-verify step
      # near the bottom): confirms the SSH signing config above actually produced a valid signature
      # before this job spends a PR-open/CI-wait/approval cycle on a commit that turns out to be
      # unsigned. HEAD here is the local, pre-merge commit -- never pushed to `main` as-is (see the
      # PR/merge steps below), so this is deliberately a fast-fail check, not the thing SECURITY.md
      # or a consumer would ever point to as "the release is verified".
      - name: Verify the local commit and tag are signed (signing smoke test)
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git verify-commit HEAD
          git verify-tag "$RELEASE_TAG"

      # Belt-and-suspenders check on top of the `needs: ci` gate above: if semantic-release (or a
      # compromised/misbehaving version of it) ever touched anything beyond the version bump and
      # changelog, stop here - before this job pushes anything or spends a PR/CI/approval cycle on
      # it. A second copy of this check runs after the merge below, re-scoped to the commit that
      # actually lands on `main` -- this one is a cheap, early fail-fast; that one is the real gate.
      - name: Validate the local release commit only touched version/changelog files
        if: steps.release.outputs.released == 'true'
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          allowed="pyproject.toml src/repo_policy/__init__.py CHANGELOG.md"
          changed="$(git diff --name-only "$SOURCE_SHA" HEAD)"
          unexpected=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case " $allowed " in
              *" $file "*) ;;
              *) unexpected="$unexpected $file" ;;
            esac
          done <<< "$changed"
          if [ -n "$unexpected" ]; then
            echo "::error::Release commit changed unexpected file(s):$unexpected"
            exit 1
          fi

      - name: Upload distribution artifacts
        if: steps.release.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1
          if-no-files-found: error

      - name: Push the version-bump branch
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/release-bot/${RELEASE_TAG}"

      - name: Open the release pull request
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "release-bot/${RELEASE_TAG}" \
            --title "chore(release): ${RELEASE_TAG}" \
            --body "Automated version bump for ${RELEASE_TAG}, opened and merged by the release bot. See docs/ci-cd.md for how this pipeline works."

      # Retries plain `gh pr merge` on an interval rather than first polling check status
      # (e.g. `gh pr checks --required --watch`). This is a deliberate design choice, not a forced
      # workaround: `RELEASE_BOT_TOKEN` is a classic PAT (see SECURITY.md's "Secrets Management" and
      # setup checklist for why -- fine-grained PATs can't be issued by an outside-collaborator
      # account on a personal-account-owned repo), and classic PATs CAN call the Checks API. This
      # design is used anyway because `gh pr merge` doesn't need that permission at all: mergeability
      # -- including whether `CI / required` has actually passed -- is evaluated server-side by
      # GitHub itself as part of the merge attempt, using the repository's own branch-protection
      # state, not the caller's read access to check details. That's a simpler dependency than
      # polling check-run status directly, and it happens to also sidestep a real, separate gap
      # (fine-grained PATs currently cannot call the Checks API at all -- confirmed against GitHub's
      # own fine-grained-PAT permissions reference), should a future migration back to fine-grained
      # ever happen. A "not mergeable yet" failure is the expected, retriable state while CI is
      # still running on the PR.
      #
      # Squash, not rebase or merge commit: linear_history: true rules out a merge commit, and only
      # squash lets --subject override the final commit message on `main` -- required so `[skip ci]`
      # can be added at merge time without ever being present on the PR's own head commit (see
      # pyproject.toml's commit_message comment for why the two must differ).
      #
      # No --admin: this must be a real, fully-compliant merge (required check green, no bypass),
      # not a bot-flavored version of the shortcut Task 9 was built to close off.
      #
      # No --delete-branch: the repo's own self-policy already sets delete_branch_on_merge: true
      # (.github/repository-policy.yml), so GitHub deletes the branch itself on merge. Keeping
      # --delete-branch too risked exactly the failure mode found in review: the merge succeeds
      # server-side, --delete-branch's own follow-up delete call errors independently (e.g. a race
      # with GitHub's own automatic deletion), gh exits non-zero for the whole command, and this
      # loop would then retry a "merge" that can never succeed again for the rest of the 30-minute
      # window -- the PR is already merged, every retry after that point is pure, confusing waste.
      - name: Wait for the PR's required check and squash-merge it
        id: merge
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          branch="release-bot/${RELEASE_TAG}"

          # If this PR is already merged -- most likely a previous run of this job timed out
          # *after* `gh pr merge` actually succeeded server-side but before this step recorded
          # that (see the timeout/retry framing below), and the workflow was re-run -- skip the
          # retry loop entirely instead of attempting a merge that can only ever fail from here.
          state="$(gh pr view "$branch" --json state -q .state)"
          if [ "$state" != "MERGED" ]; then
            deadline=$((SECONDS + 1800))
            while true; do
              # Deliberately not just `until gh pr merge ...; do`: that form discards the command's
              # output, which is exactly what the classification below needs to read to tell a
              # transient "still waiting" failure from a permanent one.
              #
              # Capturing the real exit code this way (explicit if/else, not `if var=$(cmd); then
              # ...; fi` with no else) matters more than it looks: without the else branch, bash
              # collapses a false `if` condition's own exit status to 0 when nothing else in the
              # branch runs -- confirmed by local scratch testing, where an earlier draft of this
              # exact step silently exited 0 on a genuine, non-retriable merge failure because of
              # this. `if/then/else` reads `$?` on the else branch's first line, before anything
              # else changes it, which is well-defined and correct.
              if output="$(gh pr merge "$branch" --squash \
                  --subject "chore(release): ${RELEASE_TAG} [skip ci]" \
                  --body "" 2>&1)"; then
                status=0
              else
                status=$?
              fi
              echo "$output"
              if [ "$status" -eq 0 ]; then
                break
              fi
              # Classification is grounded in gh's own merge.go source (blockedReason(), v2 CLI),
              # not guesswork:
              #   - "the base branch policy prohibits the merge" (MergeStateStatus=BLOCKED) covers
              #     both "CI / required is still running" AND "some other branch-protection
              #     requirement isn't met yet" -- gh's own message can't distinguish the two, so
              #     this is kept as the retriable default, bounded by the existing 30-minute
              #     deadline either way (unchanged from before this fix).
              #   - "the merge commit cannot be cleanly created" (MergeStateStatus=DIRTY, a real
              #     conflict) and "the head branch is not up to date with the base branch"
              #     (MergeStateStatus=BEHIND) can never resolve just by retrying `gh pr merge` --
              #     nothing in this workflow updates the branch or resolves a conflict -- so both
              #     fail fast instead of burning the full 30-minute window on a foregone conclusion.
              #   - A permission-style failure (the bot's PAT losing write/merge access mid-run) is
              #     not one of gh's own preflight-check strings above; it would surface as a raw
              #     GraphQL/HTTP error from the merge mutation itself. Matched best-effort here
              #     (not independently confirmed against a live failure -- no live token in this
              #     dispatch) since retrying it for 30 minutes is never going to help either.
              case "$output" in
                *"the merge commit cannot be cleanly created"*|*"the head branch is not up to date with the base branch"*|*"Resource not accessible"*|*"do not have permission"*|*"Must have admin rights"*)
                  echo "::error::Release PR merge failed with a non-retriable error: $output"
                  exit "$status"
                  ;;
              esac
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "::error::Timed out waiting for the release PR to become mergeable (CI / required never passed, or another merge blocker didn't clear)"
                exit 1
              fi
              echo "PR not mergeable yet (CI / required is likely still running) -- retrying in 15s"
              sleep 15
            done
          fi

          # Read back once, regardless of which path above got us here, so this is the single
          # source of truth for "the exact commit the squash-merge produced" that both the diff
          # re-check and the tag-creation step below use -- neither re-derives it from origin/main's
          # current tip, which would be wrong (and racy) if any unrelated commit lands on `main` in
          # the gap between this step and those.
          merged_sha="$(gh pr view "$branch" --json mergeCommit -q .mergeCommit.oid)"
          echo "merged_sha=${merged_sha}" >> "$GITHUB_OUTPUT"

      # Re-scoped from the pre-merge check above: this is the check that actually gates whether
      # this release proceeds to a signed tag and PyPI. GitHub's squash-merge always creates a new
      # commit on `main` (confirmed against GitHub's own docs -- see docs/ci-cd.md), so the object
      # that matters here is whatever actually landed on `main`, not the pre-merge local commit
      # diffed earlier. Diffs the exact merged commit (`MERGED_SHA`, captured by the merge step
      # above from `gh pr view --json mergeCommit`) against its own immediate parent -- not against
      # `origin/main`'s current tip, which was the pre-fix bug: that range is wrong (and racy) if
      # any unrelated commit lands on `main` between this PR being opened and merged, since this
      # check runs *after* the merge, when the release commit is already live.
      - name: Validate the merged release commit only touched version/changelog files
        if: steps.release.outputs.released == 'true'
        env:
          MERGED_SHA: ${{ steps.merge.outputs.merged_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          allowed="pyproject.toml src/repo_policy/__init__.py CHANGELOG.md"
          changed="$(git diff --name-only "${MERGED_SHA}^" "$MERGED_SHA")"
          unexpected=""
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case " $allowed " in
              *" $file "*) ;;
              *) unexpected="$unexpected $file" ;;
            esac
          done <<< "$changed"
          if [ -n "$unexpected" ]; then
            echo "::error::Merged release commit changed unexpected file(s):$unexpected"
            exit 1
          fi

      # The tag, not the commit, is this pipeline's release-bot-attributed signed artifact from here
      # on -- but not because the squash-merge commit goes unverified. GitHub actually signs
      # web-interface/API merge commits (including squash-merges) with its own key and shows them
      # Verified on `main` (see https://github.com/web-flow.gpg and GitHub's own commit-signature-
      # verification docs) -- that "no verification" language is specific to *rebase*-merge, which
      # GitHub's docs state explicitly adds commits "without commit signature verification" because
      # rebase replays them client-side and GitHub never actually authors the result. Squash-merge
      # is not that case. So the merged commit on `main` DOES get a real, independently-Verified
      # signature -- just GitHub's own (`web-flow`), attesting "GitHub performed this merge," not
      # the release-bot's, attesting "the release-bot produced this release." There is still no way
      # to get the release-bot's OWN signature onto that commit object through a required PR merge
      # -- that part is an unavoidable platform constraint, not a gap in this design -- so the
      # annotated release TAG remains this pipeline's release-bot-attributed verified artifact: a
      # separate git object from the commit it points at, created and pushed here, directly (tags
      # are outside branch protection's scope -- see this job's own top-level comment), against the
      # exact commit that now actually sits on `main`, carrying its own valid bot signature
      # regardless of whose signature (if any) the underlying commit itself carries. Both
      # signatures are real and independently meaningful: GitHub's on the commit, the bot's on the
      # tag -- see docs/ci-cd.md and SECURITY.md's "Release Signing" for the full picture.
      #
      # Uses MERGED_SHA (captured by the merge step above from `gh pr view --json mergeCommit`),
      # not a fresh `git rev-parse origin/main` here -- re-deriving the tip at this point would tag
      # whatever commit happens to be on `main` right now, which is only guaranteed to be this
      # release's own commit if nothing else has merged into `main` in the meantime. Reusing the
      # exact SHA the merge step already captured removes that race entirely, for the same reason
      # the post-merge diff-check above does.
      - name: Create, sign, and push the version tag against the merged commit
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          MERGED_SHA: ${{ steps.merge.outputs.merged_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          git tag -f -s -a "$RELEASE_TAG" -m "$RELEASE_TAG" "$MERGED_SHA"
          git push origin "refs/tags/${RELEASE_TAG}"

      # Fail closed: nothing past this point (floating tag move, GitHub release creation, and --
      # via the `publish`/`sbom`/`release-assets` jobs below -- PyPI publish, SBOM, attestation)
      # runs on an unsigned or unverifiable release. Deliberately does not also verify-commit the
      # merged commit here: per the previous step's comment, that commit structurally cannot carry
      # the bot's signature, so requiring it to would make this gate fail on every single release.
      - name: Verify the release tag's signature before publication (fail closed)
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git verify-tag "$RELEASE_TAG"

      # Runs before PyPI publish, not after: these two steps are independent, and the Action's
      # `uses: shipsolid/repo-policy@v0` consumers must not be blocked by an unrelated PyPI
      # failure. (A real release found this the hard way: the tag never moved because it was
      # sequenced after PyPI, and PyPI failed on every release — v0.1.0 through v0.1.2 — until
      # the trusted publisher was registered on pypi.org; see docs/ci-cd.md. Fixed as of v0.1.3.)
      - name: Move floating major tag
        if: steps.release.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          MAJOR_TAG="v$(echo "$RELEASE_TAG" | sed -E 's/^v([0-9]+)\..*/\1/')"
          # -c tag.gpgsign=false overrides, for this one command only, the tag.gpgsign=true set
          # globally by the host-side signing config step above (Fix 1). Without the override,
          # this command fails outright once tag.gpgsign is global: it creates a nested tag (no
          # -a/-m of its own -- see below), and git refuses to sign a tag with no message
          # ("fatal: no tag message?", exit 128) -- confirmed by local reproduction. Safe to
          # disable signing for just this tag: $MAJOR_TAG (e.g. v0) is a floating convenience
          # alias, not itself the verified release artifact -- the annotated $RELEASE_TAG it
          # (transitively) points to is what's signed and verified (see the verify-tag step
          # above). Deliberately NOT adding `^{}` to peel $RELEASE_TAG to its underlying commit:
          # `git tag -f "$MAJOR_TAG" "$RELEASE_TAG"` (no ^{}) creates a nested lightweight tag
          # pointing directly at the signed annotated tag OBJECT, and `git verify-tag "$MAJOR_TAG"`
          # verifies transitively through that nesting -- confirmed by local scratch testing
          # (ed25519 key, real allowed_signers file: a nested `tag -f` with no override fails
          # closed once tag.gpgsign=true; `-c tag.gpgsign=false tag -f` succeeds and the resulting
          # ref verifies cleanly). This is a beneficial existing property, kept as-is.
          git -c tag.gpgsign=false tag -f "$MAJOR_TAG" "$RELEASE_TAG"
          git push origin "$MAJOR_TAG" --force

      # Local `main` at this point is NOT the commit that triggered this run -- the version-bump
      # step earlier committed the bump locally, on this same branch, and that local commit was
      # what got pushed as the release-bot's PR branch. It's also not an ancestor of MERGED_SHA:
      # GitHub's squash-merge creates a brand new commit on `main`, a sibling of that local bump
      # commit, not a fast-forward of it. So this reset discards that local (already-pushed,
      # already-merged, no-longer-needed) commit and replaces it with the real one -- not a
      # fast-forward, and deliberately so.
      #
      # `semantic-release changelog` (the next step) needs local HEAD to actually reach
      # MERGED_SHA: it builds its release history by walking `git log` from HEAD backwards and
      # matching commits against tags (`ReleaseHistory.from_git_history`, confirmed by reading its
      # source), and separately refuses to run at all on a detached HEAD (checked against
      # `branches.main.match`, which defaults to matching "main" -- confirmed the same way, and
      # confirmed pyproject.toml's own `branch = "main"` key isn't what's doing this: PSR 9.21.2
      # doesn't recognize a top-level `branch` key at all). Confirmed by local reproduction: the
      # exact command below, run with local `main` left at the stale local bump commit, fails with
      # "tag v0.4.8 not in release history"; the same command, with local `main` reset to the
      # merged commit first, gets past that check cleanly.
      #
      # MERGED_SHA is this pipeline's own captured source of truth for the commit that actually
      # landed on `main` (see the tag-creation step above), so resetting straight to it is correct
      # regardless of what else may or may not be true about `main`'s tip at this exact moment.
      - name: Advance local main to the merged commit
        if: steps.release.outputs.released == 'true'
        env:
          MERGED_SHA: ${{ steps.merge.outputs.merged_sha }}
        run: |
          set -euo pipefail
          git checkout main
          git reset --hard "$MERGED_SHA"

      # PSR's own `version` command can't be safely re-invoked here to create the GitHub Release --
      # it treats an already-existing tag as "nothing to do" and no-ops (confirmed by reading
      # version.py's `previously_released_versions` check), which is exactly what the tag now is,
      # since it was pushed directly above rather than by `version --push`. `changelog
      # --post-to-release-tag` is PSR's own narrower command for precisely this: it builds release
      # notes from git history for an already-tagged version and creates (or updates) the remote
      # release for that tag, with no commit/tag/push side effects of its own.
      - name: Create the GitHub release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          pip install --quiet "python-semantic-release==9.21.2"
          semantic-release changelog --post-to-release-tag "$RELEASE_TAG"

  publish:
    name: publish
    # Split from `release` so only this job - which does nothing but publish already-built,
    # already-validated distributions - carries id-token: write. It never checks out the
    # repository and never sees contents: write.
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC trusted publishing to PyPI; this job never touches repo contents
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (currently v1.14.2)

  sbom:
    name: sbom
    # Split from `release-assets` below for exactly the reason `release`/`publish` are split from
    # each other (see `publish`'s own comment): this job's steps -- installing cyclonedx-bom from
    # PyPI, `docker build` from the release commit, `docker run`, `pip install dist/*.whl` -- are
    # not narrow, so it must never hold `contents: write` at the same time as `id-token: write`.
    # PyPI trusted publishing matches on repository + *workflow filename*, and this job lives in
    # the same file as `publish`; a compromised step here holding both repo-write and OIDC would
    # be able to mint a pypi-audience token and publish an arbitrary release -- exactly the
    # capability `release`/`publish`'s split exists to confine away from any contents: write job.
    # So: id-token: write + attestations: write here, contents: write only in `release-assets`,
    # never both in one job.
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only
      id-token: write # actions/attest-build-provenance: Sigstore OIDC signing
      attestations: write # actions/attest-build-provenance: write the attestation to this repo's attestation store
    steps:
      # Checks out the exact released commit (the tag `release` just signed and pushed), not
      # github.sha -- `release`'s own PR merge moved `main` forward past the commit that triggered
      # this workflow run, so github.sha now points at that commit's *parent*.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - run: pip install cyclonedx-bom==7.4.0 # provides the `cyclonedx-py` CLI (package/command name mismatch is intentional upstream)

      # SBOM #1: the wheel's own install environment -- what `pip install repo-policy` actually
      # puts on disk, not just its declared dependency ranges.
      - name: Generate SBOM for the wheel install environment
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --quiet dist/*.whl
          cyclonedx-py environment /tmp/wheel-env --pyproject pyproject.toml \
            --output-reproducible -o sbom-wheel.cdx.json

      # SBOM #2: the Docker Action image (Task 7) -- a single build here (unlike ci.yml's `docker`
      # job, which builds twice to prove reproducibility; that guarantee is already established
      # and gated by `needs: ci` above, so one build is enough to compute this release's SBOM).
      - name: Build the Docker Action image at this release commit
        env:
          IMAGE_REF: repo-policy-action:${{ needs.release.outputs.tag }}
        run: docker build -t "$IMAGE_REF" .

      - name: Generate SBOM for the Docker Action image
        env:
          IMAGE_REF: repo-policy-action:${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint pip "$IMAGE_REF" list --format=freeze > docker-image-freeze.txt
          cyclonedx-py requirements docker-image-freeze.txt --pyproject pyproject.toml \
            --output-reproducible -o sbom-docker.cdx.json

      # Attest the wheel, sdist, and both SBOMs against their exact published digests in one call
      # (subject-path accepts a multi-line list of globs/paths).
      - name: Attest wheel, sdist, and SBOMs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4 (currently v4.2.2)
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            sbom-wheel.cdx.json
            sbom-docker.cdx.json

      # The Docker Action image is never pushed to a registry (action.yml builds it fresh from the
      # pinned Dockerfile at consumption time -- see Task 7); subject-path (file-based) and
      # subject-digest (this case) are mutually exclusive inputs, so the image is attested in its
      # own call, by the digest of the image this job just built from the release commit's
      # Dockerfile. See SECURITY.md's "Verifying release artifacts" for what this attestation
      # does and doesn't currently let a consumer independently re-derive.
      - name: Attest the Docker Action image
        env:
          IMAGE_REF: repo-policy-action:${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          echo "IMAGE_DIGEST=$(docker inspect --format='{{.Id}}' "$IMAGE_REF")" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4 (currently v4.2.2)
        with:
          subject-name: repo-policy-action
          subject-digest: ${{ env.IMAGE_DIGEST }}

      # Hands the two SBOM files to `release-assets` (contents: write, but no id-token: write) the
      # same way `release` hands `dist/` to `publish` -- a workflow artifact, not a shared
      # checkout, so no single job ever holds both repo-write and OIDC-mint capability.
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sboms
          path: |
            sbom-wheel.cdx.json
            sbom-docker.cdx.json
          retention-days: 1
          if-no-files-found: error

  release-assets:
    name: release-assets
    # Split from `sbom` above so this job -- which does nothing but attach already-generated,
    # already-attested files to the GitHub release -- can carry contents: write without ever also
    # holding id-token: write in the same job. Never checks out the repository (nothing here needs
    # the source tree, only the downloaded SBOM files and the release tag).
    needs: [release, sbom]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload, to attach the SBOMs to the GitHub release
    steps:
      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sboms

      - name: Attach SBOMs to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # no checkout in this job, so `gh` can't infer the repo from a git remote -- must be told explicitly
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" sbom-wheel.cdx.json sbom-docker.cdx.json --clobber
