version: 1

branches:
  main:
    enforcement: branch_protection
    pull_requests:
      required: true
      approvals: 1
      code_owner_review: false
      dismiss_stale_reviews: true
      require_last_push_approval: true
    # Task 11 Step 5: exercised on both branches below so the collapsed lifecycle test can
    # independently verify both backend translators (branch_protection vs. ruleset) actually send
    # a real API payload for these, not just that repo-policy's own diff considers them satisfied.
    status_checks:
      required:
        - "repo-policy-e2e/verify"
    signed_commits: true
    linear_history: true
    allow_force_push: false
    allow_deletion: false
    enforce_admins: true
    required_conversation_resolution: true
    lock_branch: false
    allow_fork_syncing: false
    clear_restrictions: true

  repo-policy-verify:
    enforcement: ruleset
    pull_requests:
      required: true
      approvals: 1
      code_owner_review: false
      dismiss_stale_reviews: true
      require_last_push_approval: true
    status_checks:
      required:
        - "repo-policy-e2e/verify"
    signed_commits: true
    linear_history: true
    allow_force_push: false
    allow_deletion: false

repo_settings:
  delete_branch_on_merge: true
  allow_update_branch: true
  vulnerability_alerts: true
  automated_security_fixes: true
  private_vulnerability_reporting: true
  secret_scanning: true
  secret_scanning_push_protection: true
